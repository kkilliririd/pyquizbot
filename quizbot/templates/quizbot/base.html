<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pyquiz bot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    @font-face { font-family: 'Narnia'; src: local('Narnia'); }
    body { background: #0f0f1a; color: #e8e8f0; font-family: 'Narnia', serif; min-height: 100vh; }
    .navbar { background: #1a1a2e !important; border-bottom: 1px solid #2d2d4e; }
    .navbar-brand { color: #514ED9 !important; font-weight: 700; letter-spacing: 1px; }
    .nav-link { color: #a0a0c0 !important; }
    .nav-link:hover { color: #3F8FD2 !important; }
    .card { background: #1a1a2e; border: 1px solid #2d2d4e; border-radius: 16px; }
    .btn-main { background: linear-gradient(135deg, #514ED9, #3F8FD2); border: none; color: #fff; border-radius: 10px; font-weight: 600; }
    .btn-main:hover { background: linear-gradient(135deg, #3F8FD2, #514ED9); color: #fff; }
    .btn-opt { background: #12122a; border: 1.5px solid #2d2d4e; color: #c0c0e0; border-radius: 10px; text-align: left; transition: all 0.2s; }
    .btn-opt:hover { border-color: #514ED9; color: #fff; background: #1e1e3e; }
    .badge-topic { background: #2d2d4e; color: #3F8FD2; font-size: 0.72rem; padding: 4px 10px; border-radius: 20px; font-weight: 600; }
    .progress { background: #2d2d4e; border-radius: 10px; height: 6px; }
    .progress-bar { background: linear-gradient(90deg, #514ED9, #3F8FD2); border-radius: 10px; }
    .alert-ok { background: #0d2b1e; border: 1px solid #1a6b45; color: #36D696; border-radius: 10px; }
    .alert-err { background: #2b0d0d; border: 1px solid #6b1a1a; color: #f87171; border-radius: 10px; }
    .alert-hint { background: #2b2200; border: 1px solid #6b5500; color: #FFC473; border-radius: 10px; }
    .score-circle { width: 110px; height: 110px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 800; margin: 0 auto; }
    .table { color: #c0c0e0; }
    .table td, .table th { border-color: #2d2d4e; }
    .tag-5 { color: #36D696; } .tag-4 { color: #3F8FD2; } .tag-3 { color: #FFC473; } .tag-2 { color: #f87171; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'home' %}">pyquiz bot</a>
    <div class="d-flex gap-3">
      <a class="nav-link" href="{% url 'home' %}">главная</a>
      <a class="nav-link" href="{% url 'history' %}">история</a>
    </div>
  </div>
</nav>
<div class="container pb-5" style="max-width:680px;">
  {% block content %}{% endblock %}
</div>
</body>
</html>
